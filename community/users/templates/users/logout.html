{% extends "base.html" %}
{% block title %}Logged Out | Community{% endblock %}

{% block content %}
<style>
  body {
    background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
  }

  .logout-card {
    max-width: 420px;
    width: 100%;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    text-align: center;
    padding: 40px 30px;
    animation: fadeIn 0.6s ease-in-out;
  }

  .logout-card h2 {
    font-weight: 700;
    color: #2575fc;
  }

  .logout-card p {
    color: #555;
    margin-top: 10px;
    margin-bottom: 25px;
  }

  .btn-login {
    background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
    border: none;
    border-radius: 12px;
    color: white;
    font-weight: 600;
    padding: 10px 25px;
    transition: all 0.3s ease;
    text-decoration: none;
  }

  .btn-login:hover {
    transform: scale(1.05);
    background: linear-gradient(135deg, #5d0eca 0%, #2364e5 100%);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<div class="logout-card">
  <div class="d-flex align-items-center gap-3 mb-4">
    <a href="{% url 'users:login' %}" class="btn btn-sm btn-light">
      <i class="bi bi-arrow-left"></i> Back to Login
    </a>
  </div>
  <h2><i class="bi bi-box-arrow-right me-2"></i>Logged Out</h2>
  <p>You have successfully logged out of your Community account.</p>
  <a href="{% url 'users:login' %}" class="btn-login">
    <i class="bi bi-box-arrow-in-right me-1"></i> Log back in
  </a>
</div>

<!-- Bootstrap icons (if not in base.html) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
{% endblock %}
