services:
  - type: web
    name: community-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn community.wsgi:application
    envVars:
      - key: DEBUG
        value: False
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: your-app-name.onrender.com
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis
          property: connectionString
    plan: free

  - type: redis
    name: redis
    plan: free
