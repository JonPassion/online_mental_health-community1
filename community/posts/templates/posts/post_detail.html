{% extends "base.html" %}
{% block title %}{{ post.title }}{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="card shadow-sm">
    <div class="card-header">
      <div class="d-flex align-items-center gap-3">
        <a href="{% url 'posts:post_list' %}" class="btn btn-gradient btn-sm">
          <i class="bi bi-arrow-left"></i> Back
        </a>
        <h3 class="mb-0">{{ post.title }}</h3>
        {% if user == post.author %}
          <div class="ms-auto">
            <a href="{% url 'posts:post_edit' post.pk %}" class="btn btn-sm btn-outline-primary">Edit</a>
          </div>
        {% endif %}
      </div>
    </div>
    <div class="card-body">
      <div class="mb-3">
        <small class="text-muted">
          By <strong>{{ post.author.username }}</strong> on {{ post.created_at|date:"F d, Y H:i" }}
        </small>
      </div>
      <div class="post-content">
        {{ post.content|linebreaks }}
      </div>
    </div>
    <div class="card-footer">
      <a href="{% url 'posts:post_list' %}" class="btn btn-secondary">← Back to Posts</a>
    </div>
  </div>
</div>
{% endblock %}
