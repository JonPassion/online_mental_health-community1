services:
  - type: web
    name: community-app
    env: python
    buildCommand: pip install -r community/requirements.txt && cd community && python manage.py collectstatic --noinput
    startCommand: cd community && gunicorn community.wsgi:application
    envVars:
      - key: DEBUG
        value: False
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: your-app-name.onrender.com
      - key: DATABASE_URL
        fromService:
          type: postgres
          name: postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis
          property: connectionString
    plan: free

  - type: redis
    name: redis
    plan: free

  - type: psql
    name: postgres
    plan: free
