services:
  - type: web
    name: community-app
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r community/requirements.txt && cd community && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: cd community && daphne -b 0.0.0.0 -p $PORT community.asgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: community-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: community-redis
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  - name: community-db
    plan: free
    region: oregon

  - type: redis
    name: community-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
